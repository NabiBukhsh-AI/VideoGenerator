name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Ruff
        run: ruff check videogen tests --output-format=github

      - name: Ruff format check
        run: ruff format --check videogen tests
        continue-on-error: true

      - name: mypy
        run: mypy videogen
        continue-on-error: true

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        include:
          # Only the newest Python on Linux runs the ffmpeg-dependent render tests.
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Verify ffmpeg
        run: ffmpeg -version

      - name: Run tests
        run: pytest -v --cov=videogen --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Offline end-to-end render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Doctor
        run: videogen doctor

      - name: Render a video with no API keys
        run: |
          videogen generate --dry-run -o output/ci --scenes 3 \
            "The deep ocean remains the least explored region on Earth. \
             Sunlight fades entirely below one thousand metres, leaving a permanent night. \
             Creatures there produce their own light through bioluminescence. \
             Pressure at the seafloor exceeds one thousand atmospheres."

      - name: Assert the output is a real H.264 MP4
        run: |
          video=$(find output/ci -name '*.mp4' | head -1)
          test -n "$video" || { echo "No MP4 produced"; exit 1; }
          echo "Produced: $video ($(stat -c%s "$video") bytes)"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -of default=noprint_wrappers=1 "$video" | tee probe.txt
          grep -q 'codec_name=h264' probe.txt
          grep -q 'pix_fmt=yuv420p' probe.txt
          grep -q 'width=1080' probe.txt
          grep -q 'height=1920' probe.txt
          test -n "$(find output/ci -name '*.srt' | head -1)" || { echo "No subtitles"; exit 1; }

      - name: Upload the rendered sample
        uses: actions/upload-artifact@v4
        with:
          name: sample-video
          path: output/ci/**/*.mp4
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
